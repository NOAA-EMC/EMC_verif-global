[dir]
# Input directories
INPUT_BASE = {ENV[DATA]}/{ENV[RUN]}/data
FCST_GRID_STAT_INPUT_DIR = {INPUT_BASE}/{MODEL}
OBS_GRID_STAT_INPUT_DIR = {INPUT_BASE}/{MODEL}
# Output directories
OUTPUT_BASE = {ENV[DATA]}/{ENV[RUN]}/metplus_output
LOG_DIR = {OUTPUT_BASE}/logs/{MODEL}
TMP_DIR = {OUTPUT_BASE}/tmp
GRID_STAT_OUTPUT_DIR = {OUTPUT_BASE}/make_met_data_by_{LOOP_BY}/grid_stat/{ENV[RUN_type]}/{MODEL}

[filename_templates]
# Input templates
GRID_STAT_CLIMO_MEAN_FILE_NAME = {ENV[FIXverif_global]}/climo_files/cmean_1d.1959{valid?fmt=%m%d}
GRID_STAT_CLIMO_STDEV_FILE_NAME =
FCST_GRID_STAT_INPUT_TEMPLATE = f{lead?fmt=%HHH}.{init?fmt=%Y%m%d%H}
OBS_GRID_STAT_INPUT_TEMPLATE = {ENV[RUN_type]}.truth.{valid?fmt=%Y%m%d%H}
# Output templates
GRID_STAT_OUTPUT_TEMPLATE =
# VX masks
GRID_STAT_MASK_POLY = {ENV[FIXverif_global]}/vx_mask_files/{ENV[RUN_case]}/NHX.nc, {ENV[FIXverif_global]}/vx_mask_files/{ENV[RUN_case]}/SHX.nc, {ENV[FIXverif_global]}/vx_mask_files/{ENV[RUN_case]}/TRO.nc, {ENV[FIXverif_global]}/vx_mask_files/{ENV[RUN_case]}/PNA.nc

[config]
# METplus application
PROCESS_LIST = GridStat
ALLOW_MISSING_INPUTS = True
INPUT_THRESH = 0.0
# Logging and MET and METplus conf
LOG_METPLUS = {LOG_DIR}/run_metplus_{ENV[RUN]}_{ENV[RUN_type]}_makemetdataby{LOOP_BY}_for{ENV[DATE]}_runon{CLOCK_TIME}.log
METPLUS_CONF = {OUTPUT_BASE}/confs/{MODEL}/run_metplus_{ENV[RUN]}_{ENV[RUN_type]}_makemetdataby{LOOP_BY}_for{ENV[DATE]}_runon{CLOCK_TIME}.conf
# Dates
LOOP_BY = {ENV[make_met_data_by]}
INIT_TIME_FMT = %Y%m%d%H
INIT_BEG = {ENV[DATE]}{ENV[init_hr_beg]}
INIT_END = {ENV[DATE]}{ENV[init_hr_end]}
INIT_INCREMENT = {ENV[init_hr_inc]}
# Model and observation
MODEL = {ENV[model]}
OBTYPE = {ENV[obtype]}
# Forecast and observation files
FCST_GRID_STAT_INPUT_DATATYPE = GRIB
FCST_IS_PROB = False
FCST_GRID_STAT_PROB_THRESH =
OBS_GRID_STAT_INPUT_DATATYPE = GRIB
OBS_IS_PROB = False
OBS_GRID_STAT_PROB_THRESH =
# Forecast leads
LEAD_SEQ = {ENV[fhr_list]}
LEAD_SEQ_MIN = {ENV[fhr_beg]}H
LEAD_SEQ_MAX = {ENV[fhr_end]}H
# Variables
BOTH_VAR1_NAME = TMP
BOTH_VAR1_LEVELS = P850, P500, P250
BOTH_VAR2_NAME = UGRD
BOTH_VAR2_LEVELS = P850, P500, P250
BOTH_VAR3_NAME = VGRD
BOTH_VAR3_LEVELS = P850, P500, P250
BOTH_VAR4_NAME = PRMSL
BOTH_VAR4_LEVELS = Z0
# GridStat
GRID_STAT_DESC = on_{ENV[grid]}
GRID_STAT_ONCE_PER_FIELD = False
GRID_STAT_CONFIG_FILE = {PARM_BASE}/met_config/GridStatConfig_wrapped
GRID_STAT_SKIP_IF_OUTPUT_EXISTS = False
GRID_STAT_MASK_GRID = {ENV[grid]}
GRID_STAT_REGRID_TO_GRID = {ENV[grid]}
GRID_STAT_REGRID_METHOD = BILIN
GRID_STAT_REGRID_WIDTH = 2
GRID_STAT_REGRID_VLD_THRESH= 0.5
GRID_STAT_REGRID_SHAPE = SQUARE
GRID_STAT_NC_PAIRS_VAR_NAME =
GRID_STAT_CLIMO_MEAN_FIELD =
GRID_STAT_CLIMO_MEAN_REGRID_METHOD = BILIN
GRID_STAT_CLIMO_MEAN_REGRID_WIDTH = 2
GRID_STAT_CLIMO_MEAN_REGRID_VLD_THRESH = 0.5
GRID_STAT_CLIMO_MEAN_REGRID_SHAPE = SQUARE
GRID_STAT_CLIMO_MEAN_TIME_INTERP_METHOD = NEAREST
GRID_STAT_CLIMO_MEAN_MATCH_MONTH = FALSE
GRID_STAT_CLIMO_MEAN_MATCH_DAY = TRUE
GRID_STAT_CLIMO_MEAN_DAY_INTERVAL = 31
GRID_STAT_CLIMO_MEAN_HOUR_INTERVAL = 6
GRID_STAT_CLIMO_STDEV_FIELD =
GRID_STAT_CLIMO_STDEV_REGRID_METHOD = BILIN
GRID_STAT_CLIMO_STDEV_REGRID_WIDTH = 2
GRID_STAT_CLIMO_STDEV_REGRID_VLD_THRESH = 0.5
GRID_STAT_CLIMO_STDEV_REGRID_SHAPE = SQUARE
GRID_STAT_CLIMO_STDEV_TIME_INTERP_METHOD = NEAREST
GRID_STAT_CLIMO_STDEV_MATCH_MONTH = FALSE
GRID_STAT_CLIMO_STDEV_DAY_INTERVAL = 31
GRID_STAT_CLIMO_STDEV_HOUR_INTERVAL = 6
GRID_STAT_CLIMO_CDF_CDF_BINS = 1
GRID_STAT_CLIMO_CDF_CENTER_BINS = FALSE
GRID_STAT_CLIMO_CDF_WRITE_BINS = FALSE
GRID_STAT_FOURIER_WAVE_1D_BEG =
GRID_STAT_FOURIER_WAVE_1D_END =
GRID_STAT_INTERP_FIELD = BOTH
GRID_STAT_INTERP_VLD_THRESH= 1.0
GRID_STAT_INTERP_SHAPE = SQUARE
GRID_STAT_INTERP_TYPE_METHOD = NEAREST
GRID_STAT_INTERP_TYPE_WIDTH = 1
GRID_STAT_NEIGHBORHOOD_WIDTH = 1
GRID_STAT_NEIGHBORHOOD_SHAPE = SQUARE
GRID_STAT_NEIGHBORHOOD_COV_THRESH = >=0.5
GRID_STAT_GRID_WEIGHT_FLAG = COS_LAT
GRID_STAT_OUTPUT_FLAG_SAL1L2= STAT
GRID_STAT_OUTPUT_FLAG_VAL1L2= STAT
GRID_STAT_OUTPUT_PREFIX = {ENV[RUN_type]}_{MODEL}_vs_{OBTYPE}
LOG_GRID_STAT_VERBOSITY = {LOG_MET_VERBOSITY}
GRID_STAT_NC_PAIRS_FLAG_LATLON = FALSE
GRID_STAT_NC_PAIRS_FLAG_RAW = FALSE
GRID_STAT_NC_PAIRS_FLAG_DIFF = FALSE
GRID_STAT_NC_PAIRS_FLAG_CLIMO = FALSE
GRID_STAT_NC_PAIRS_FLAG_CLIMO_CDP = FALSE
GRID_STAT_NC_PAIRS_FLAG_WEIGHT = FALSE
GRID_STAT_NC_PAIRS_FLAG_NBRHD = FALSE
GRID_STAT_NC_PAIRS_FLAG_FOURIER = FALSE
GRID_STAT_NC_PAIRS_FLAG_GRADIENT = FALSE
GRID_STAT_NC_PAIRS_FLAG_DISTANCE_MAP = FALSE
GRID_STAT_NC_PAIRS_FLAG_APPLY_MASK = FALSE
GRID_STAT_MET_CONFIG_OVERRIDES = climo_mean = fcst;
