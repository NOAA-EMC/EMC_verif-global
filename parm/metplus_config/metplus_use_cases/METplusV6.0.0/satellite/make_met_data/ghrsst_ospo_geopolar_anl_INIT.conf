[dir]
# Input directories
INPUT_BASE = {ENV[DATA]}/{ENV[RUN]}/data
FCST_PCP_COMBINE_INPUT_DIR = {INPUT_BASE}/{MODEL}
FCST_GRID_STAT_INPUT_DIR = {FCST_PCP_COMBINE_OUTPUT_DIR}
OBS_GRID_STAT_INPUT_DIR = {INPUT_BASE}/{OBTYPE}
# Output directories
OUTPUT_BASE = {ENV[DATA]}/{ENV[RUN]}/metplus_output
LOG_DIR = {OUTPUT_BASE}/logs/{MODEL}
TMP_DIR = {OUTPUT_BASE}/tmp
FCST_PCP_COMBINE_OUTPUT_DIR = {OUTPUT_BASE}/make_met_data_by_{LOOP_BY}/pcp_combine/{OBTYPE}/{MODEL}
GRID_STAT_OUTPUT_DIR = {OUTPUT_BASE}/make_met_data_by_{LOOP_BY}/grid_stat/{OBTYPE}/{MODEL}/{ENV[DATE]}

[filename_templates]
# Input templates
FCST_PCP_COMBINE_INPUT_TEMPLATE = f{lead?fmt=%HHH}.{init?fmt=%Y%m%d%H}
FCST_PCP_COMBINE_OUTPUT_TEMPLATE = f{lead?fmt=%HHH}.{init?fmt=%Y%m%d%H}.mean
FCST_GRID_STAT_INPUT_TEMPLATE = {FCST_PCP_COMBINE_OUTPUT_TEMPLATE}
OBS_GRID_STAT_INPUT_TEMPLATE = {OBTYPE}.{valid?fmt=%Y%m%d%H}
# Output templates
GRID_STAT_OUTPUT_TEMPLATE =

[config]
# METplus application
PROCESS_LIST = PCPCombine, GridStat
ALLOW_MISSING_INPUTS = True
# Logging and MET and METplus conf
LOG_METPLUS = {LOG_DIR}/run_metplus_{ENV[RUN]}_{OBTYPE}_makemetdataby{LOOP_BY}_for{ENV[DATE]}_runon{CLOCK_TIME}.log
METPLUS_CONF = {OUTPUT_BASE}/confs/{MODEL}/run_metplus_{ENV[RUN]}_{OBTYPE}_makemetdataby{LOOP_BY}_for{ENV[DATE]}_runon{CLOCK_TIME}.conf
# Dates
LOOP_BY = {ENV[make_met_data_by]}
INIT_TIME_FMT = %Y%m%d%H
INIT_BEG = {ENV[DATE]}{ENV[init_hr_beg]}
INIT_END = {ENV[DATE]}{ENV[init_hr_end]}
INIT_INCREMENT = {ENV[init_hr_inc]}
# Model and observation
MODEL = {ENV[model]}
OBTYPE = {ENV[obtype]}
# Forecast and observation files
FCST_PCP_COMBINE_INPUT_DATATYPE = GRIB
FCST_GRID_STAT_INPUT_DATATYPE = NETCDF
FCST_IS_PROB = False
FCST_GRID_STAT_PROB_THRESH =
OBS_PCP_COMBINE_INPUT_DATATYPE = GRIB
OBS_GRID_STAT_INPUT_DATATYPE = GRIB
OBS_IS_PROB = False
OBS_GRID_STAT_PROB_THRESH =
# Forecast leads
LEAD_SEQ = {ENV[fhr_list]}
LEAD_SEQ_MIN = {ENV[fhr_beg]}H
LEAD_SEQ_MAX = {ENV[fhr_end]}H
# Variables
USE_EXPLICIT_NAME_AND_LEVEL = True
FCST_VAR1_NAME = TMP_Z0_mean
FCST_VAR1_LEVELS = "(*,*)"
OBS_VAR1_NAME = analysed_sst
OBS_VAR1_LEVELS = "(0,*,*)"
FCST_VAR2_NAME = ICEC_Z0_mean
FCST_VAR2_LEVELS = "(*,*)"
FCST_VAR2_THRESH = ge{ENV[sea_ice_thresh]}, lt{ENV[sea_ice_thresh]}
FCST_VAR2_OPTIONS = cnt_thresh = [ ge{ENV[sea_ice_thresh]} ];
OBS_VAR2_NAME = sea_ice_fraction
OBS_VAR2_LEVELS = "(0,*,*)"
OBS_VAR2_THRESH = ge{ENV[sea_ice_thresh]}, lt{ENV[sea_ice_thresh]}
OBS_VAR2_OPTIONS = cnt_thresh = [ ge{ENV[sea_ice_thresh]} ]; cnt_logic = UNION;
# PCPCombine
LOG_PCP_COMBINE_VERBOSITY = {LOG_MET_VERBOSITY}
PCP_COMBINE_SKIP_IF_OUTPUT_EXISTS = True
FCST_PCP_COMBINE_RUN = True
FCST_PCP_COMBINE_METHOD = USER_DEFINED
FCST_PCP_COMBINE_COMMAND = -derive mean {FCST_PCP_COMBINE_INPUT_DIR}/f{lead?fmt=%HHH}.{init?fmt=%Y%m%d%H} {FCST_PCP_COMBINE_INPUT_DIR}/f{lead?fmt=%HHH?shift=-6H}.{init?fmt=%Y%m%d%H} {FCST_PCP_COMBINE_INPUT_DIR}/f{lead?fmt=%HHH?shift=-12H}.{init?fmt=%Y%m%d%H} {FCST_PCP_COMBINE_INPUT_DIR}/f{lead?fmt=%HHH?shift=-18H}.{init?fmt=%Y%m%d%H} {FCST_PCP_COMBINE_INPUT_DIR}/f{lead?fmt=%HHH?shift=-24H}.{init?fmt=%Y%m%d%H} -field 'name="TMP"; level="Z0";' -field 'name="ICEC"; level="Z0";'
FCST_PCP_COMBINE_MIN_FORECAST = {ENV[fhr_beg]}H
FCST_PCP_COMBINE_MAX_FORECAST = {ENV[fhr_end]}H
FCST_PCP_COMBINE_OUTPUT_NAME = {FCST_VAR1_NAME}, {FCST_VAR2_NAME}
FCST_PCP_COMBINE_LOOKBACK = 30H
FCST_PCP_COMBINE_BUCKET_INTERVAL = 6H
FCST_PCP_COMBINE_CONSTANT_INIT = True
OBS_PCP_COMBINE_RUN = False
# GridStat
GRID_STAT_CONFIG_FILE = {PARM_BASE}/met_config/GridStatConfig_wrapped

GRID_STAT_DESC = on_{ENV[grid]}

GRID_STAT_MASK_GRID = {ENV[grid]}

GRID_STAT_ONCE_PER_FIELD = False
GRID_STAT_SKIP_IF_OUTPUT_EXISTS = False
GRID_STAT_REGRID_TO_GRID = {ENV[grid]}
GRID_STAT_REGRID_METHOD = BILIN
GRID_STAT_REGRID_WIDTH = 2

GRID_STAT_CLIMO_MEAN_INPUT_NAME = {ENV[FIXverif_global]}/climo_files/cmean_1d.1959{valid?fmt=%m%d}
GRID_STAT_CLIMO_MEAN_FIELD = 
GRID_STAT_CLIMO_MEAN_REGRID_METHOD = BILIN
GRID_STAT_CLIMO_MEAN_REGRID_WIDTH = 2
GRID_STAT_CLIMO_MEAN_REGRID_VLD_THRESH = 0.5
GRID_STAT_CLIMO_MEAN_REGRID_SHAPE = SQUARE
GRID_STAT_CLIMO_MEAN_TIME_INTERP_METHOD = NEAREST
GRID_STAT_CLIMO_MEAN_MATCH_MONTH = FALSE

GRID_STAT_CLIMO_STDEV_INPUT_NAME =
GRID_STAT_CLIMO_STDEV_FIELD =
GRID_STAT_CLIMO_STDEV_REGRID_METHOD = BILIN
GRID_STAT_CLIMO_STDEV_REGRID_WIDTH = 2
GRID_STAT_CLIMO_STDEV_REGRID_VLD_THRESH = 0.5
GRID_STAT_CLIMO_STDEV_REGRID_SHAPE = SQUARE
GRID_STAT_CLIMO_STDEV_TIME_INTERP_METHOD = NEAREST
GRID_STAT_CLIMO_STDEV_MATCH_MONTH = FALSE

GRID_STAT_CLIMO_CDF_WRITE_BINS = FALSE

GRID_STAT_MASK_POLY = {ENV[FIXverif_global]}/vx_mask_files/{ENV[RUN_case]}/NH.nc, {ENV[FIXverif_global]}/vx_mask_files/{ENV[RUN_case]}/SH.nc, {ENV[FIXverif_global]}/vx_mask_files/{ENV[RUN_case]}/POLAR.nc, {ENV[FIXverif_global]}/vx_mask_files/{ENV[RUN_case]}/ARCTIC.nc, {ENV[DATA]}/{ENV[RUN]}/data/{OBTYPE}/{OBTYPE}.{valid?fmt=%Y%m%d%H}.vx_mask.SEA_ICE.nc, {ENV[DATA]}/{ENV[RUN]}/data/{OBTYPE}/{OBTYPE}.{valid?fmt=%Y%m%d%H}.vx_mask.SEA_ICE_POLAR.nc, {ENV[DATA]}/{ENV[RUN]}/data/{OBTYPE}/{OBTYPE}.{valid?fmt=%Y%m%d%H}.vx_mask.SEA_ICE_FREE.nc, {ENV[DATA]}/{ENV[RUN]}/data/{OBTYPE}/{OBTYPE}.{valid?fmt=%Y%m%d%H}.vx_mask.SEA_ICE_FREE_POLAR.nc

GRID_STAT_OUTPUT_FLAG_SL1L2= STAT
GRID_STAT_OUTPUT_FLAG_CTC= STAT

GRID_STAT_OUTPUT_PREFIX = {MODEL}_vs_{OBTYPE}
LOG_GRID_STAT_VERBOSITY = {LOG_MET_VERBOSITY}

GRID_STAT_NC_PAIRS_VAR_NAME =
GRID_STAT_NC_PAIRS_FLAG_LATLON = FALSE
GRID_STAT_NC_PAIRS_FLAG_RAW = FALSE
GRID_STAT_NC_PAIRS_FLAG_DIFF = FALSE
GRID_STAT_NC_PAIRS_FLAG_CLIMO = FALSE
GRID_STAT_NC_PAIRS_FLAG_APPLY_MASK = FALSE

GRID_STAT_GRID_WEIGHT_FLAG = COS_LAT
